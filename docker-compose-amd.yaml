services:
  ollama-amd:
    container_name: ollama-amd
    image: ollama/ollama:rocm
    # pull_policy: always
    healthcheck:
      test: ollama ps || exit 1
      interval: 10s
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - ollama-network
    devices:
      # kfd and dri device access needed for AMDGPU ROCm support to work
      - /dev/kfd
      - /dev/dri
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Keep models loaded in memory for 5 minutes after last use
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NOHISTORY=1
      # Reduce attention memory usage for longer contexts
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      # Reserve 1.5 GiB of VRAM for the desktop and runtime allocations
      - OLLAMA_GPU_OVERHEAD=1610612736
    # wierd params from
    # https://github.com/avnigashi/ollama-rocm-docker/blob/main/docker-compose.yml
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined

